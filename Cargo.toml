[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
categories = ["api-bindings"]
keywords = ["discord", "wrapper", "api"]
license = "Apache-2.0"
repository = "https://github.com/cbrra/oxicord"
description = "Rust crate to interact with the Discord API"
edition = "2024"

[workspace.dependencies]
oxicord_api_types = { path = "./crates/oxicord_api_types", version = "0.1.0" }
oxicord_builders = { path = "./crates/oxicord_builders", version = "0.1.0" }
oxicord_formatters = { path = "./crates/oxicord_formatters", version = "0.1.0" }
oxicord_patterns = { path = "./crates/oxicord_patterns", version = "0.1.0" }
oxicord_snowflake = { path = "./crates/oxicord_snowflake", version = "0.1.0" }
oxicord_macros = { path = "./crates/oxicord_macros", version = "0.1.0" }

serde = "1.0.229"
serde_json = "1.0.151"
serde_repr = "0.1"
bitflags = "2.13.1"
thiserror = "2.0.19"
tokio = "1.53.1"
